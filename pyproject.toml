[project]
name = "hands-on-ai-agents"
version = "0.1.0"
description = "Hands-on AI agents: ReAct, Plan-Solve, and Reflection implementations on the HelloAgents framework."
requires-python = ">=3.12,<3.13"
dependencies = [
    "hello-agents==0.1.1",
    "openai==2.44.0",
    "python-dotenv==1.2.2",
    "google-search-results==2.4.2",
    "pydantic==2.10.3",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "pytest>=8.0",
]
